# terraform-docs config. Regenerate the reference in README.md with:
#
#   terraform-docs infra/modules/ecr-repository
#
# It rewrites only the text between the BEGIN_TF_DOCS / END_TF_DOCS markers.
formatter: markdown table

output:
  file: README.md
  mode: inject

sort:
  enabled: true
  by: required

settings:
  anchor: false
  default: true
  hide-empty: true
  lockfile: false
  required: true
  type: true
