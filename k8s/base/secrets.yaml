# The api's secrets, from Vault, through the External Secrets Operator.
#
# The ServiceAccount is the credential. External Secrets presents its token to
# Vault; Vault checks it with the Kubernetes API and maps it to a policy that
# reads one path (k8s/platform/install.sh). No token is stored in this
# repository or in the cluster to get the first secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-secrets-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: lab-api
          serviceAccountRef:
            name: api-secrets-reader
            audiences: ["vault"]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secrets
spec:
  # How long a change in Vault takes to reach the Kubernetes Secret, at most.
  refreshInterval: 15s
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: api-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: lab/api
