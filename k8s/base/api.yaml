# The api: a Deployment behind a ClusterIP Service. Projects 10 and 11.
#
# Nothing here says which environment it is. The overlays set the namespace,
# the replica count, the resources and the config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
  annotations:
    # Reloader restarts the pods when this Secret changes. Environment
    # variables are read once, at container start; without a restart, a
    # rotated secret reaches nothing until the next deploy.
    secret.reloader.stakater.com/reload: api-secrets
spec:
  replicas: 2
  # Project 12. One extra pod during a rollout, never one fewer: capacity
  # stays at the replica count the whole way through. These are the
  # defaults (25%/25%) rounded for 2 or 3 replicas, written out because
  # at 4 replicas the defaults allow one pod down.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # Old ReplicaSets kept for `kubectl rollout undo`. With 0 there is nothing
  # to undo to.
  revisionHistoryLimit: 5
  # A rollout with no progress for this long is marked failed, and
  # `kubectl rollout status` exits non-zero. Pods here are ready in ~3s.
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      # Covers the preStop sleep plus finishing requests already in flight.
      # The kubelet sends SIGKILL when it runs out.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # Numeric, because the image says `USER app`. With only a name the
        # kubelet cannot check it is not root (Project 10).
        runAsUser: 1001
        runAsGroup: 1001
      initContainers:
        # Creates the orders table if it is missing. On a fresh namespace it
        # fails until DynamoDB answers, and the kubelet retries it with
        # backoff: the cluster works out the start-up order without a script.
        # Local only. In AWS the table is Terraform's (Capstone B).
        - name: create-table
          image: ci-cd-lab/api:local
          imagePullPolicy: Never
          command: ["python", "-c", "from api.store import OrderStore; OrderStore().create_table()"]
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: ci-cd-lab/api:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          # Config and secrets from outside the image and outside this file.
          # api-config comes from the kustomization's configMapGenerator;
          # api-secrets is written by External Secrets from Vault.
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          # Project 12. Deleting a pod starts two things at once: the kubelet
          # stops the container, and the endpoints controller and kube-proxy
          # take the pod out of the Service. uvicorn closes its socket on
          # SIGTERM in milliseconds, before kube-proxy has caught up, and
          # new connections routed to it are refused (156 in one measured
          # rollout). Waiting 5s before SIGTERM lets the routing change land
          # first. A sleep action, not `sh -c "sleep 5"`: no shell needed.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # Startup: generous, and only once. Liveness does not start counting
          # until this has passed, so a slow cold start is not killed.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Readiness: is this pod fit to receive traffic right now. Failing
          # it removes the pod from the Service; nothing is restarted.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          # Liveness: is the process wedged. Failing it restarts the
          # container. It must not depend on anything outside the process:
          # if it checked DynamoDB, a database blip would restart every pod
          # at once.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
