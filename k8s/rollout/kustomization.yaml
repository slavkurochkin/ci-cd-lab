# The load generator as a Job. Project 12.
#
#   kubectl -n lab-prod delete job loadgen --ignore-not-found
#   kubectl -n lab-prod apply -k k8s/rollout
#   ... start a rollout ...
#   kubectl -n lab-prod logs -f job/loadgen
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - loadgen.yaml

configMapGenerator:
  - name: loadgen
    files:
      - loadgen.py
