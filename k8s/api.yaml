# Project 10: the api as a Deployment behind a ClusterIP Service.
#
#   kubectl apply --server-side -f k8s/namespace.yaml -f k8s/api.yaml
#
# The image is built into minikube with `minikube image build` (see
# README.md), so it is never pulled from a registry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lab
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 2
  # The Deployment owns pods whose labels match this. It is immutable after
  # creation, and it must match the template's labels below.
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      securityContext:
        runAsNonRoot: true
        # Numeric, because the image says `USER app`. With only a name the
        # kubelet cannot check it is not root, and refuses to start the
        # container: "image has non-numeric user (app), cannot verify user
        # is non-root".
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: api
          # An explicit tag, and Never: run exactly what `minikube image
          # build` produced, or fail with ErrImageNeverPull. A `:latest` tag
          # would default the pull policy to Always and try Docker Hub.
          image: ci-cd-lab/api:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: minikube
          # Readiness decides whether the Service sends traffic; liveness
          # decides whether the kubelet restarts the container. They answer
          # different questions, so they hit different endpoints.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lab
  labels:
    app.kubernetes.io/name: api
spec:
  type: ClusterIP
  # Not tied to the Deployment at all. The Service sends traffic to any
  # ready pod whose labels match this selector. A typo here is not an error:
  # it is a Service with no endpoints.
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
