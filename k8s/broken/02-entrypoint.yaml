# Broken on purpose. Project 12, case 2.
#
#   kubectl apply -f k8s/broken/00-namespace.yaml -f k8s/broken/02-entrypoint.yaml
#
# Symptom: RESTARTS keeps climbing and STATUS shows CrashLoopBackOff.
# Find the cause with kubectl before reading k8s/broken/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: entrypoint
  namespace: lab-broken
spec:
  replicas: 1
  selector:
    matchLabels: {app: entrypoint}
  template:
    metadata:
      labels: {app: entrypoint}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: api
          image: ci-cd-lab/api:local
          imagePullPolicy: Never
          command: ["uvicorn", "api.main:application", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "/app/src"]
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 128Mi}
