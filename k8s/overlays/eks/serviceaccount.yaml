# The name Pod Identity binds to an IAM role (infra/eks/identity.tf). Nothing
# here mentions AWS: the association is on the AWS side, keyed on this
# namespace and this name. A pod under any other ServiceAccount gets no
# credentials, and no error says why.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
  annotations:
    # Project 14: before the pre-flight hook (wave -1) that runs under it.
    argocd.argoproj.io/sync-wave: "-2"
