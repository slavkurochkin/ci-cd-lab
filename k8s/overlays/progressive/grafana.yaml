# Grafana with one provisioned dashboard. Project 16.
#
# Anonymous admin, no login: a lab dashboard reached only through
# `kubectl port-forward`, never exposed. Everything on it is derived from
# Prometheus, including the deploy markers: a git_sha in api_build_info that
# did not exist a minute earlier. Nothing in the pipeline posts annotations.
#
#   kubectl -n lab-progressive port-forward svc/grafana 3000:3000
#   open http://localhost:3000/d/api-delivery
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus:9090
        isDefault: true
        jsonData:
          timeInterval: 5s
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: lab
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  api-delivery.json: |
    {
      "title": "api delivery",
      "uid": "api-delivery",
      "refresh": "5s",
      "schemaVersion": 39,
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "annotations": {
        "list": [
          {
            "name": "deploys",
            "enable": true,
            "iconColor": "orange",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "expr": "count by (git_sha) (api_build_info) unless count by (git_sha) (api_build_info offset 1m)",
            "step": "15s",
            "titleFormat": "deploy {{git_sha}}",
            "tagKeys": "git_sha",
            "useValueForTime": false
          }
        ]
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "5xx share by build",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum by (git_sha) (rate(api_requests_total{status=~\"5..\"}[1m]) * on(pod) group_left(git_sha) api_build_info) or sum by (git_sha) (rate(api_requests_total[1m]) * on(pod) group_left(git_sha) api_build_info) * 0) / sum by (git_sha) (rate(api_requests_total[1m]) * on(pod) group_left(git_sha) api_build_info)",
              "legendFormat": "{{git_sha}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "5xx share, all users",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(rate(api_requests_total{status=~\"5..\"}[1m])) or vector(0)) / sum(rate(api_requests_total[1m]))",
              "legendFormat": "5xx share"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "requests per second by build",
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (git_sha) (rate(api_requests_total[1m]) * on(pod) group_left(git_sha) api_build_info)",
              "legendFormat": "{{git_sha}}"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.2.5
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
            - {name: data, mountPath: /var/lib/grafana}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
