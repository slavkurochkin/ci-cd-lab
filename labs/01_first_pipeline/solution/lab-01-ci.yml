# Lab 01 -- Pipelines & the Build Contract (solution)
#
# The build contract for this repository: every change to either service is
# formatted, linted, and tested before it can merge.
name: Lab 01 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: app/api
        run: uv sync --extra dev

      - name: Lint and format check
        working-directory: app/api
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        working-directory: app/api
        run: uv run pytest

  worker:
    name: worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: app/worker
        run: npm ci

      - name: Lint and format check
        working-directory: app/worker
        run: |
          npm run lint
          npm run format:check

      - name: Run tests
        working-directory: app/worker
        run: npm test
