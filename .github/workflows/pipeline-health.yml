# Pipeline health: flaky tests and sharding, measured. Project 18.
#
# flaky       tests the report scripts' arithmetic, then runs the api suite 20 times in shuffled order, weekly and when
#             the detector changes, and fails if any test both passed and
#             failed. It also checks the detector against a suite with three
#             known flaky tests: it must find exactly those three.
# runner-minutes  weekly: runner minutes by workflow for the last 7 days,
#             written to S3 for infra/cost-report's Monday Slack digest.
# shards-N    the same 12-second suite split across N runners, to measure what
#             a runner costs in startup compared with what it saves. Runs only
#             when the fixture or this file changes, or by hand.
name: Pipeline health

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/flaky.py
      - scripts/pipeline_report.py
      - scripts/dora.py
      - scripts/error_budget.py
      - scripts/test_*.py
      - infra/cost-report/lambda/**
      - scripts/flaky_fixture/**
      - scripts/shard_fixture/**
      - .github/workflows/pipeline-health.yml

permissions:
  contents: read

jobs:
  flaky:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Tests of the report scripts' arithmetic
        working-directory: scripts
        run: uv run --no-project --with pytest python -m pytest -q -p no:cacheprovider -c /dev/null --rootdir . test_pipeline_report.py test_delivery_metrics.py
      - name: Tests of the cost digest
        working-directory: infra/cost-report/lambda
        run: uv run --no-project --with pytest python -m pytest -q -p no:cacheprovider -c /dev/null --rootdir . test_cost_report.py
      - name: The detector finds the three known flaky tests, and only those
        run: |
          set +e
          python3 scripts/flaky.py --runs 30 --cwd scripts/flaky_fixture --quarantine found.txt -- \
            uv run --no-project --with pytest --with pytest-randomly python -m pytest -q -p no:cacheprovider \
            '--junitxml={junit}' test_known.py
          set -e
          diff <(sort scripts/flaky_fixture/quarantine.txt) <(sort found.txt)
      - name: The api suite, 20 shuffled runs
        run: |
          python3 scripts/flaky.py --runs 20 --cwd app/api -- \
            uv run --extra dev --with pytest-randomly pytest -q -p no:cacheprovider --no-cov '--junitxml={junit}'

  # Runs on main only (the schedule, or by hand): the CI role trusts main and
  # v* tags, not pull requests. 06:17 UTC, before the digest at 08:00.
  runner-minutes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner minutes, last 7 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pipeline_report.py --days 7 --json runner-minutes.json
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1
      - name: Hand them to the cost digest
        run: aws s3 cp runner-minutes.json "s3://ci-cd-lab-artifacts-$(aws sts get-caller-identity --query Account --output text)/pipeline/runner-minutes.json"

  shards-1:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/pipeline-health-shard.yml
    with: {total: 1, indexes: "[0]"}
  shards-2:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/pipeline-health-shard.yml
    with: {total: 2, indexes: "[0, 1]"}
  shards-4:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/pipeline-health-shard.yml
    with: {total: 4, indexes: "[0, 1, 2, 3]"}
  shards-8:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/pipeline-health-shard.yml
    with: {total: 8, indexes: "[0, 1, 2, 3, 4, 5, 6, 7]"}
