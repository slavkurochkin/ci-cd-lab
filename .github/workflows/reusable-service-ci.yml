# Lab 03 -- reusable workflow (starter)
#
# This is the build contract for *any* service in this repository. It must not
# know anything about Python or Node -- every service exposes the same Makefile
# targets, so this workflow calls `make lint` and `make test` and lets the
# service decide what those mean.
name: Reusable service CI

# TODO(lab-03-b): A workflow becomes callable by declaring `workflow_call`.
# Replace the trigger below with `workflow_call` and declare three inputs.
# Unlike composite action inputs, these are typed -- and the type is required:
#
#   service                -- required, type: string
#   versions               -- optional, type: string, a JSON array,
#                             default '["default"]'
#   run-integration-tests  -- optional, type: boolean, default false
#
# Then declare an `outputs:` block exposing `coverage-artifact`, whose `value:`
# reads the `test` job's output of the same name. A reusable workflow that
# returns nothing is a script; one with outputs is an interface.
on:
  workflow_call:
    inputs:
      service:
        description: The service to test -- also the directory name under app/.
        required: true
        type: string
      versions:
        description: JSON array of runtime versions, as a string. Inputs cannot be lists.
        required: false
        type: string
        default: '["default"]'
      run-integration-tests:
        description: Whether to run the integration suite against a real dependency.
        required: false
        type: boolean
        default: false
      ecr-registry:
        description: >-
          ECR registry host, e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com.
          Empty means GHCR only, which is what a fork without an AWS account
          gets -- the pipeline still builds, scans and attests.
        required: false
        type: string
        default: ""
      publish:
        description: >-
          Whether to push the image. A pull request builds and scans but must
          not publish, so the caller passes this only on the default branch.
        required: false
        type: boolean
        default: false
    outputs:
      coverage-artifact:
        description: Name of the artifact holding this service's coverage report.
        value: ${{ jobs.test.outputs.coverage-artifact }}
      image-digest:
        description: >-
          Digest of the published image, or empty when this call did not
          publish. A digest is the only identifier that cannot come to mean
          something else later -- deploy this, not a tag.
        value: ${{ jobs.image.outputs.digest }}

# A reusable workflow does not inherit the caller's permissions -- it declares
# its own, and the caller can only narrow them further. Nothing here writes to
# the repository.
permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.service }} (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # TODO(lab-03-c): Add a matrix over the versions the caller asked for.
    #
    # A matrix cannot be passed directly as an input -- inputs may only be
    # strings, booleans or numbers. The caller therefore passes a JSON array as
    # a string, and you unpack it here with fromJSON(). Set fail-fast to false,
    # and put the matrix value in the job `name:` so the legs are told apart.
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.versions) }}


    # TODO(lab-03-b): Declare a job output named `coverage-artifact` with the
    # value `coverage-<service>`.
    #
    # Note *why* that value is safe: it does not depend on the matrix. A job
    # output that varied per matrix leg would be written by every leg and the
    # last writer wins, with no defined ordering.
    outputs:
      coverage-artifact: coverage-${{ inputs.service }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves GITHUB_TOKEN in .git/config. Anything that later
          # uploads the working directory as an artifact would ship the token
          # with it. Nothing here pushes back to git, so nothing needs it.
          persist-credentials: false

      - name: Set up ${{ inputs.service }}
        # TODO(lab-03-a2): Call your composite action. A local action is
        # referenced by path from the repository root, and the repository must
        # already be checked out -- which is why this step comes second.
        uses: ./.github/actions/setup-service
        with:
          service: ${{ inputs.service }}

      # The build contract, cheapest first. Every service answers to the same
      # six targets, so none of these steps knows whether it is running Python
      # or Node -- see labs/03_abstraction.
      - name: Lint and format check
        working-directory: app/${{ inputs.service }}
        run: make lint

      - name: Typecheck
        working-directory: app/${{ inputs.service }}
        run: make typecheck

      - name: Run tests
        working-directory: app/${{ inputs.service }}
        run: make test

      # Separate from `make test` on purpose. The tests answer "does it work";
      # this answers "is any of it unexercised", and the two fail for different
      # reasons. Thresholds live with each service, not here -- what counts as
      # covered is a property of the code, not of the pipeline.
      - name: Coverage gate
        working-directory: app/${{ inputs.service }}
        run: make coverage

  # TODO(lab-03-e): Add an `integration` job that runs the API's integration
  # suite against a real DynamoDB.
  #
  #   - run it only when the caller passed run-integration-tests
  #   - declare a `services:` block with image amazon/dynamodb-local:2.5.2,
  #     mapping container port 8000 to host port 8000
  #   - check out, then set up the service with your composite action
  #   - wait for DynamoDB to answer on http://localhost:8000 before testing
  #   - run `make test-integration` in app/<service> with DYNAMODB_ENDPOINT
  #     and AWS_REGION set in the step's env
  #
  # About the wait: `services:` supports health checks via
  # `options: --health-cmd ...`, and when the image can describe its own
  # readiness that is the right answer. amazon/dynamodb-local ships no curl,
  # wget or shell health tool, so there is nothing for --health-cmd to run
  # inside the container. When an image cannot describe its own readiness,
  # waiting for it becomes your job -- and a job that starts testing before the
  # dependency is up fails intermittently, which is the worst kind of failure.
  integration:
    # Distinct from the test job's name. Both jobs would otherwise report as
    # the service name and be indistinguishable in the checks list.
    name: ${{ inputs.service }} integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.run-integration-tests
    services:
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports:
          - 8000:8000
        # No `options: --health-cmd` here on purpose. The health command runs
        # *inside* the service container, and this image is a JRE plus a jar --
        # no curl, no wget, no shell health tool. There is nothing to run, so
        # the readiness wait below is the job's problem instead.

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves GITHUB_TOKEN in .git/config. Anything that later
          # uploads the working directory as an artifact would ship the token
          # with it. Nothing here pushes back to git, so nothing needs it.
          persist-credentials: false

      - name: Set up ${{ inputs.service }}
        uses: ./.github/actions/setup-service
        with:
          service: ${{ inputs.service }}

      - name: Wait for DynamoDB
        # DynamoDB Local answers 400 to an unsigned GET, which is proof it is
        # listening. `curl -f` treats 400 as failure, so check that the request
        # completed at all rather than that it succeeded.
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8000; then
              echo "dynamodb-local is up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::dynamodb-local did not answer on :8000 within 30s"
          exit 1

      - name: Run integration tests
        working-directory: app/${{ inputs.service }}
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          AWS_REGION: us-east-1
        run: make test-integration

  # The second half of the build contract. It runs only after the first half
  # passed: there is no point building an image from code that does not lint,
  # typecheck, test or meet its coverage floor.
  #
  # `needs` includes integration, which is skipped for services that have no
  # integration suite -- hence `always()` plus an explicit result check, the
  # same shape as an aggregate job. Without it, a skipped dependency would skip
  # this too.
  image:
    name: ${{ inputs.service }} image
    needs: [test, integration]
    if: |
      always()
      && needs.test.result == 'success'
      && needs.integration.result != 'failure'
      && needs.integration.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      digest: ${{ steps.push.outputs.digest }}

    env:
      REGISTRY: ghcr.io

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Without this, buildx falls back to an anonymous token and GHCR answers
      # 403 at push time -- after the build and the scan have already run. The
      # job's `packages: write` permission grants the right; GITHUB_TOKEN is
      # how it is presented.
      - name: Log in to the registry
        if: inputs.publish
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Credentials for ECR come from the same OIDC flow as everything else.
      # No access key is stored, and the role's trust policy accepts only the
      # default branch and version tags -- which is why this cannot run from a
      # pull request, and why the condition below is on `publish`.
      - name: Assume the AWS role
        if: inputs.publish && inputs.ecr-registry != ''
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR
        if: inputs.publish && inputs.ecr-registry != ''
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          # Two registries. GHCR is public and free and is where attestation
          # verification is cheapest; ECR is what EKS pulls from without a
          # stored pull secret. metadata-action emits the same tag set for
          # each, so a digest published to one is published to both.
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.service }}
            ${{ inputs.ecr-registry != '' && format('{0}/ci-cd-lab/{1}', inputs.ecr-registry, inputs.service) || '' }}
          # No `latest`. A mutable tag cannot tell you what is running -- ask
          # it twice and it may answer differently. The SHA tag is the one to
          # deploy; the semver tag exists for humans reading a release page.
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      # Built and loaded locally first, so the scan below has something to
      # inspect that has not been published yet.
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: app/${{ inputs.service }}
          load: true
          tags: local/${{ inputs.service }}:scan
          build-args: GIT_SHA=${{ github.sha }}
          # The registry-backed Actions cache. Layers survive between runs, so
          # a source-only change reuses the dependency layer -- which is what
          # the Dockerfile's layer order was written for.
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ inputs.service }}:scan
          format: table
          # The gate. Anything HIGH or CRITICAL fails the job and nothing is
          # published. Note `ignore-unfixed`: a vulnerability with no available
          # fix cannot be acted on, and failing on it teaches people to add
          # blanket ignores, which is worse than not scanning.
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Only reached when the scan passed. The layers are already built, so
      # this is a push rather than a rebuild.
      - name: Push
        id: push
        if: inputs.publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: app/${{ inputs.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service }}
          # A software bill of materials: what is inside the image, attached to
          # the image. During an incident the question is "which of our images
          # contain this package", and without an SBOM the answer is a guess.
          sbom: true
          provenance: mode=max

      - name: Attest build provenance
        if: inputs.publish
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Report what was published
        if: inputs.publish
        # Values reach the shell through env, never interpolated into the
        # script. `${{ }}` inside a `run:` block is textual substitution before
        # the shell sees it, so a value containing shell syntax becomes shell
        # syntax. These particular values are safe; the habit is what matters,
        # and it is the same rule Project 4 applies to github.event.*.
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.service }}
          REPO: ${{ github.repository }}
        run: |
          echo "digest: $DIGEST"
          echo
          echo "Verify from anywhere:"
          echo "  gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${REPO}"
