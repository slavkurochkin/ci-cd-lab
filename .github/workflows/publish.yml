# Project 5 -- build, scan, publish, attest.
#
# The ordering is the lesson. A scan that runs after the push is a report; a
# scan that runs before it is a gate. This builds locally, scans the image it
# just built, and only pushes if the scan passes.
#
# A matrix over the two services is the right tool here, and it was not before
# Lab 03. Both services now expose the same Dockerfile interface, so the legs
# genuinely run the same commands with a different value -- which is exactly
# the homogeneous variation Lab 02 said a matrix is for.
name: Publish

# Retired from automatic triggering.
#
# Capstone A folded these steps into reusable-service-ci.yml, so the repository
# has one pipeline rather than two. Leaving this on `push` would publish every
# image twice.
#
# The file stays because it is Lab 05's graded artifact: `make lab LAB=05`
# installs a starter here, `make verify LAB=05` reads it, and it is still
# runnable by hand. Deleting it would delete the lab.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  image:
    # `image (api)`, not `api`. Branch protection matches required checks by
    # name alone, and three lab workflows already report jobs called `api` and
    # `worker` -- so a required `api` would be satisfied by whichever workflow
    # reported last, which is not a gate.
    name: image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]

    permissions:
      contents: read
      # Push to GHCR.
      packages: write
      # attest-build-provenance signs with a short-lived certificate obtained
      # through OIDC, the same mechanism as the AWS role. No key is stored.
      id-token: write
      attestations: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Without this, buildx falls back to an anonymous token and GHCR answers
      # 403 at push time -- after the build and the scan have already run. The
      # job's `packages: write` permission grants the right; GITHUB_TOKEN is
      # how it is presented.
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          # No `latest`. A mutable tag cannot tell you what is running -- ask
          # it twice and it may answer differently. The SHA tag is the one to
          # deploy; the semver tag exists for humans reading a release page.
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      # Built and loaded locally first, so the scan below has something to
      # inspect that has not been published yet.
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: app/${{ matrix.service }}
          load: true
          tags: local/${{ matrix.service }}:scan
          build-args: GIT_SHA=${{ github.sha }}
          # The registry-backed Actions cache. Layers survive between runs, so
          # a source-only change reuses the dependency layer -- which is what
          # the Dockerfile's layer order was written for.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.service }}:scan
          format: table
          # The gate. Anything HIGH or CRITICAL fails the job and nothing is
          # published. Note `ignore-unfixed`: a vulnerability with no available
          # fix cannot be acted on, and failing on it teaches people to add
          # blanket ignores, which is worse than not scanning.
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Only reached when the scan passed. The layers are already built, so
      # this is a push rather than a rebuild.
      - name: Push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: app/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          # A software bill of materials: what is inside the image, attached to
          # the image. During an incident the question is "which of our images
          # contain this package", and without an SBOM the answer is a guess.
          sbom: true
          provenance: mode=max

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Report what was published
        if: github.event_name != 'pull_request'
        # Values reach the shell through env, never interpolated into the
        # script. `${{ }}` inside a `run:` block is textual substitution before
        # the shell sees it, so a value containing shell syntax becomes shell
        # syntax. These particular values are safe; the habit is what matters,
        # and it is the same rule Project 4 applies to github.event.*.
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          REPO: ${{ github.repository }}
        run: |
          echo "digest: $DIGEST"
          echo
          echo "Verify from anywhere:"
          echo "  gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${REPO}"

  images-passed:
    name: images-passed
    needs: [image]
    # Runs even when a leg was skipped or failed, so there is always something
    # for branch protection to read. `needs.image.result` is the matrix as a
    # whole: it is `success` only when every leg succeeded.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the image jobs
        env:
          RESULT: ${{ needs.image.result }}
        run: |
          set -euo pipefail
          echo "image jobs: $RESULT"
          case "$RESULT" in
            success|skipped) ;;
            *) echo "::error::an image job reported '$RESULT'"; exit 1 ;;
          esac
