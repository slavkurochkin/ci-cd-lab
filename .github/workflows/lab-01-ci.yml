# Lab 01 -- Pipelines & the Build Contract
#
# This workflow is deliberately incomplete. Five TODOs stand between it and a
# real build contract. Fix them in this file, then run:
#
#   make verify LAB=01
#
name: Lab 01 CI

# TODO(lab-01-a): This workflow only runs when you press a button, which means
# it protects nothing. Make it run on every pull request targeting `main`, and
# on every push to `main`. Keep workflow_dispatch -- being able to run it by
# hand is genuinely useful.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege for the whole workflow. The repository default is already
# `read`, but a default is a setting someone can change; this is a declaration
# that travels with the file. Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    # TODO(lab-01-e): A job with no timeout can hang for six hours on a stuck
    # network call, burning runner minutes the whole time. Give this job a
    # timeout appropriate to a suite that takes seconds.
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves GITHUB_TOKEN in .git/config. Anything that later
          # uploads the working directory as an artifact would ship the token
          # with it. Nothing here pushes back to git, so nothing needs it.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install dependencies
        working-directory: app/api
        run: uv sync --extra dev

      # TODO(lab-01-c): The build contract for this repo is format, lint, and
      # test. Only tests run here. Add a step that runs ruff -- both the lint
      # check and the format check -- before the tests.
      - name: Run ruff
        working-directory: app/api
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        working-directory: app/api
        # TODO(lab-01-b): `|| true` makes this step succeed no matter what the
        # tests did. Find out what the job looks like in the Actions UI with
        # this here, then remove it.
        run: uv run pytest
  # TODO(lab-01-d): This repository has two services and only one of them is
  # covered. Add a `worker` job that does for app/worker what the api job does
  # for app/api:
  #
  #   - check out the repository
  #   - set up Node 22 using actions/setup-node
  #   - install dependencies with `npm ci`
  #   - run `npm run lint` and `npm run format:check`
  #   - run `npm test`
  #
  # It must not depend on the api job -- the two services are independent, and
  # you want both results from a single run, not the first failure.
  worker:
    name: worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves GITHUB_TOKEN in .git/config. Anything that later
          # uploads the working directory as an artifact would ship the token
          # with it. Nothing here pushes back to git, so nothing needs it.
          persist-credentials: false

      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'
          # setup-node resolves this relative to the repo root, not to any
          # step's working-directory. Without it the action aborts looking for
          # a lockfile that only exists one directory down.
          cache-dependency-path: app/worker/package-lock.json
      - name: Install dependencies
        working-directory: app/worker
        run: npm ci

      - name: Run lint
        working-directory: app/worker
        run: npm run lint

      - name: Run format
        working-directory: app/worker
        run: npm run format:check

      - name: Run tests
        working-directory: app/worker
        run: npm test