# How GitHub groups pull requests in generated release notes.
#
# Categorisation is by label, not by commit message. This repository writes
# descriptive commit subjects rather than conventional-commit prefixes, so a
# tool that parses `feat:` and `fix:` would categorise almost nothing and
# would quietly impose a commit convention nobody agreed to.
#
# Labels are applied by a human deciding what a change is, which is the part
# that actually needs judgement.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking
      labels: [breaking]
    - title: Pipeline
      labels: [pipeline, ci]
    - title: Security
      labels: [security]
    - title: Services
      labels: [api, worker]
    - title: Curriculum
      labels: [lab, docs]
    - title: Dependencies
      labels: [dependencies]
    # Anything unlabelled still appears, so a forgotten label loses nothing.
    - title: Other
      labels: ["*"]
