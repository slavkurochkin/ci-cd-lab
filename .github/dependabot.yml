# Pinning actions to a SHA stops a tag being moved under you. It also stops you
# receiving fixes, so a pin without an update mechanism is a slow leak of a
# different kind. Dependabot rewrites the SHA and the trailing version comment
# together, as a pull request the pipeline checks like any other.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

    groups:
      # Patch and minor updates are bundled. They are the weekly noise, they
      # carry no promised breakage, and five separate pull requests a week is
      # how people learn to merge these without reading them.
      actions-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

      # Major updates are deliberately NOT grouped -- there is no entry for
      # them here, so Dependabot opens one pull request per action.
      #
      # This config originally grouped everything with a bare `patterns: ["*"]`.
      # The first pull request it produced bundled fifteen major version jumps
      # across five actions. The tests happened to pass; had they failed, the
      # cause could have been any of the five, and bisecting means unpicking a
      # single commit by hand.
      #
      # A major version is a promise that something breaks. One per pull
      # request means a red run names its own cause.
