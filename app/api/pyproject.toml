[project]
name = "lab-api"
version = "0.1.0"
description = "Sample HTTP service for the CI/CD lab curriculum."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Integration tests are excluded by default so the fast loop stays fast.
# Run them with: DYNAMODB_ENDPOINT=http://localhost:8000 uv run pytest -m integration
addopts = "-q -m 'not integration'"
markers = [
    "integration: needs a real dependency (DynamoDB). Excluded from the default run.",
]
