# The only thing between one preview's load test and every other preview's
# pods. Sized for what a preview runs (one api, one DynamoDB Local) with room
# for one rolling update.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: preview
spec:
  hard:
    pods: "4"
    requests.cpu: 300m
    requests.memory: 768Mi
    limits.memory: 1536Mi
    services.loadbalancers: "0"
    services.nodeports: "0"
---
# Defaults for a container that names no resources; without them the quota
# refuses the pod outright ("must specify requests.cpu").
apiVersion: v1
kind: LimitRange
metadata:
  name: preview
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 20m, memory: 64Mi}
      default: {memory: 256Mi}
