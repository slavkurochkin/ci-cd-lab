# The api in dev. Project 14.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-dev
  namespace: argocd
spec:
  project: api
  source:
    repoURL: https://github.com/slavkurochkin/ci-cd-lab.git
    targetRevision: main
    path: deploy/envs/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: api-dev
  syncPolicy:
    automated:
      prune: true
      # Put back anything changed in the cluster and not in Git.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Delete what Git no longer has only after every wave has succeeded.
      # Without it, a sync turned away by the pre-flight hook still pruned
      # the previous ConfigMap that the running pods reference, and the next
      # pod to restart failed with CreateContainerConfigError (Capstone C).
      - PruneLast=true
