# Argo CD manages its own installation from deploy/argocd.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/slavkurochkin/ci-cd-lab.git
    targetRevision: main
    path: deploy/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      # No prune. A mistake in deploy/argocd that drops a resource should not
      # be able to delete part of the thing that would undo the mistake.
      prune: false
    syncOptions:
      # The CRDs are too large for the annotation client-side apply writes.
      - ServerSideApply=true
