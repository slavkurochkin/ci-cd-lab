# External Secrets Operator: copies values from SSM Parameter Store into
# Kubernetes Secrets. Project 17.
#
# Its AWS identity comes from Pod Identity on the `external-secrets`
# ServiceAccount (infra/eks/secrets.tf). That identity can only assume the
# secrets-reader role, with the ExternalSecret's namespace as a session tag.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.13.0
    helm:
      releaseName: external-secrets
      valuesObject:
        # One pod, not three. The webhook only validates ExternalSecret
        # objects as they are written, and the CRDs serve v1 alone, so no
        # conversion webhook is needed. A bad ExternalSecret is reported in
        # its status instead of being refused.
        webhook:
          create: false
        certController:
          create: false
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
