# The api in dev: what is running there is what this file says. Project 14.
#
# Argo CD (deploy/apps/api-dev.yaml) applies this directory and keeps the
# cluster matching it. To change what runs in dev, change this file in a
# pull request.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: api-dev

resources:
  - ../../../k8s/overlays/eks

# The release. A digest, from GHCR: public, so the nodes pull it with no
# credentials, and no account ID ends up in Git. Main CI publishes the same
# digest to GHCR and ECR.
images:
  - name: ci-cd-lab/api
    newName: ghcr.io/slavkurochkin/ci-cd-lab/api
    digest: sha256:d0fcfc2a1d672c53f6c1d28959070b97dc450636b52d2683e3fe354b679f171f

replicas:
  - name: api
    count: 1

configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - ENVIRONMENT=dev

# No load balancer per environment: nothing outside the cluster calls the
# api here, and each Classic ELB bills by the hour.
patches:
  - target:
      kind: Service
      name: api
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
